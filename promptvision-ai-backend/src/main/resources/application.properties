
# ==========================================
# APPLICATION CONFIGURATION
# ==========================================

spring.application.name=PromptVisionAI
server.port=8080


# ==========================================
# GOOGLE GEMINI - PRIMARY AI CHAT & RECIPES
# ==========================================

spring.ai.model.chat=openai

spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.chat.api-key=${GEMINI_API_KEY}

spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.model=gemini-3.1-flash-lite


# ==========================================
# NVIDIA NEMOTRON - CHAT BACKUP
# ==========================================

app.chat.backup.base-url=https://integrate.api.nvidia.com/v1
app.chat.backup.api-key=${NVIDIA_API_KEY}
app.chat.backup.model=nvidia/nemotron-3.5-super-vl-120b-a12b


# ==========================================
# DISABLE DEFAULT IMAGE MODEL
# ==========================================

spring.ai.model.image=none


# ==========================================
# IMAGE GENERATION PROVIDER
# ==========================================

# Active: AI Horde
# Backup: NVIDIA FLUX.1-dev

app.image.provider=aihorde


# ==========================================
# AI HORDE - FREE IMAGE GENERATION
# ==========================================

aihorde.base-url=https://aihorde.net/api/v2
aihorde.api-key=${AI_HORDE_API_KEY:0000000000}
aihorde.client-agent=PromptVisionAI:1.0:local-development


# ==========================================
# NVIDIA FLUX.1-DEV - IMAGE BACKUP
# ==========================================

nvidia.api.key=${NVIDIA_API_KEY}
nvidia.image.url=https://ai.api.nvidia.com/v1/genai/black-forest-labs/flux.1-dev


# ==========================================
# SPRING SECURITY + JWT
# ==========================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60


# ==========================================
# POSTGRESQL DATABASE
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/spring_ai_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}


# ==========================================
# SPRING DATA JPA
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


# ==========================================
# IMAGE STORAGE
# ==========================================

app.image.storage-path=${IMAGE_STORAGE_PATH:./uploads/images}
